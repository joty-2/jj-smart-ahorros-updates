name: Compilar JJ SMART AHORROS Windows
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias y crear icono
        shell: powershell
        run: |
          python -m pip install --upgrade pip pyinstaller PySide6 cryptography numpy Pillow
          python -c "from PIL import Image; img=Image.open('assets/logo_ahorros.png'); img.save('assets/logo.ico', format='ICO', sizes=[(256,256),(128,128),(64,64),(32,32)])"
      - name: Compilar ejecutable Windows
        shell: powershell
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed --name "JJ_SMART_AHORROS" --icon="assets/logo.ico" --add-data "assets;assets" --hidden-import=impresion_ahorros --hidden-import=registro_continuo_ahorros --hidden-import=updater_independiente --hidden-import=actualizaciones_ahorros --hidden-import=panel_propietario --hidden-import=panel_referencia --hidden-import=prestamos_flexibles --hidden-import=prestamos_interfaz --hidden-import=recuperacion_ahorros --hidden-import=socios_voz --hidden-import=PySide6.QtPrintSupport main.py
      - name: Subir ejecutable a la ultima Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v1.1.6 "dist/JJ_SMART_AHORROS.exe" --clobber
