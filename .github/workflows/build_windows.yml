name: Compilar Multiplataforma (Windows + macOS)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias Windows
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PySide6 cryptography requests certifi numpy pillow
      - name: Generar icono ICO
        run: |
          python -c "from PIL import Image; img=Image.open('assets/logo_ahorros.png'); img.save('assets/logo.ico', format='ICO', sizes=[(256,256),(128,128),(64,64),(32,32)])"
      - name: Compilar Windows EXE
        shell: powershell
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed --name "JJ_SMART_AHORROS" --icon="assets/logo.ico" --add-data "assets;assets" --hidden-import=impresion_ahorros --hidden-import=registro_continuo_ahorros --hidden-import=updater_independiente --hidden-import=actualizaciones_ahorros --hidden-import=panel_propietario --hidden-import=panel_referencia --hidden-import=prestamos_flexibles --hidden-import=prestamos_interfaz --hidden-import=recuperacion_ahorros --hidden-import=socios_voz --hidden-import=PySide6.QtPrintSupport main.py
          Compress-Archive -Path "dist/JJ_SMART_AHORROS.exe" -DestinationPath "dist/JJ_SMART_AHORROS_win.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: paquete-windows
          path: |
            dist/JJ_SMART_AHORROS_win.zip
            dist/JJ_SMART_AHORROS.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias macOS
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PySide6 cryptography requests certifi numpy pillow
      - name: Compilar macOS APP
        run: |
          python -m PyInstaller --noconfirm --windowed --name "JJ SMART AHORROS" --add-data "assets:assets" --hidden-import=impresion_ahorros --hidden-import=registro_continuo_ahorros --hidden-import=updater_independiente --hidden-import=actualizaciones_ahorros --hidden-import=panel_propietario --hidden-import=panel_referencia --hidden-import=prestamos_flexibles --hidden-import=prestamos_interfaz --hidden-import=recuperacion_ahorros --hidden-import=socios_voz --hidden-import=PySide6.QtPrintSupport main.py
          cd dist && ditto -c -k --sequesterRsrc --keepParent "JJ SMART AHORROS.app" "JJ_SMART_AHORROS_mac.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: paquete-macos
          path: dist/JJ_SMART_AHORROS_mac.zip
